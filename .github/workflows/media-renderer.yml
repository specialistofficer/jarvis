name: Jarvis Media Renderer

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/media-renderer.yml"
      - "scripts/render-media.mjs"

permissions:
  contents: read
  id-token: write

concurrency:
  group: jarvis-media-renderer
  cancel-in-progress: false

jobs:
  render:
    # One run drains at most five tasks so free-runner usage stays bounded.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install zero-cost render tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends librsvg2-bin ffmpeg espeak-ng
      - name: Request short-lived GitHub identity token
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('jarvis-media-renderer');
            core.setSecret(token);
            core.exportVariable('JARVIS_OIDC_TOKEN', token);
      - name: Render queued Jarvis media
        env:
          JARVIS_API_BASE: https://jarvis-api.chiragsharma376.workers.dev
        run: node scripts/render-media.mjs
